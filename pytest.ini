[pytest]
testpaths = backend/tests
pythonpath = backend
; ``not volume`` by default: the volume tests load tens of thousands of rows to
; prove the things only row count can break — bind-parameter chunking, an index
; actually being used, totals still reconciling at scale. They take minutes, so
; they are opt-in rather than part of the gate every change runs:
;
;     pytest -m volume
;     CREDIT_VOLUME_ROWS=200000 pytest -m volume
addopts = -ra -m "not volume"
markers =
    volume: loads a realistic row count; slow, opt-in, run before a release
filterwarnings =
    ignore::DeprecationWarning
