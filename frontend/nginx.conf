server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's mime.types has no entry for .mjs, and MapLibre's worker is loaded
    # as a *module* worker — which the browser refuses to execute unless the
    # response carries a JavaScript type. Without this the worker goes out as
    # application/octet-stream, is blocked on MIME grounds, and the map draws
    # neither basemap tiles nor boundaries. Matches deploy/local/nginx.conf.
    types {
        text/javascript  mjs;
    }

    # The app is a single-page router: unknown paths must return index.html so
    # a deep link such as /performance?level=area works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are safe to cache forever; index.html never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
