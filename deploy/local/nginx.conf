# Nginx for the localhost deployment: serves the React bundle and proxies the
# API, so the browser sees one origin — http://localhost.
#
# Run it with an explicit prefix so nothing is written next to the binary:
#   nginx.exe -p D:/MIH/AI_Business_Agent/deploy/local/run -c <this file>
# Relative paths below (logs/, temp/) therefore resolve under run/.
#
# Every path is absolute with forward slashes: nginx accepts those on Windows and
# a backslash would be read as an escape.

worker_processes  1;
error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       D:/MIH/AI_Business_Agent/deploy/local/nginx/conf/mime.types;
    default_type  application/octet-stream;

    # nginx's mime.types has no entry for .geojson, so the eight basemap files
    # under /geo/ would go out as application/octet-stream. geoData.ts reads them
    # with response.json() and would not care, but a wrong Content-Type also
    # excludes them from gzip_types below — and they are 3.3 MB of coordinates
    # that compress by roughly an order of magnitude.
    # nginx's mime.types also has no entry for .mjs, and MapLibre's worker is
    # loaded as a *module* worker — which the browser refuses to execute unless
    # the response is a JavaScript type. Without this the worker is served as
    # application/octet-stream, is blocked on MIME grounds, and the map draws
    # neither basemap tiles nor boundaries.
    types {
        application/geo+json  geojson;
        text/javascript       mjs;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time ut=$upstream_response_time';
    access_log  logs/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    # Do not advertise the version in responses or on error pages.
    server_tokens   off;

    # 32 MB, sized from the application's own ceiling rather than picked: uploads
    # are capped at 25 MB in upload/files.py (MAX_UPLOAD_BYTES). Nginx checks
    # Content-Length before the request reaches the backend, so a limit below that
    # would turn a legitimate 20 MB workbook into a 413 the application never
    # sees and cannot explain. The headroom covers multipart framing.
    client_max_body_size  32m;
    client_body_temp_path temp/client_body;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/geo+json image/svg+xml;

    upstream api_backend {
        server 127.0.0.1:8000;
        # A pool of idle upstream connections. Needs HTTP/1.1 and an emptied
        # Connection header on the proxy side, both set in the locations below.
        keepalive 16;
    }

    server {
        # Every interface, deliberately: the platform is served to other PCs on
        # the LAN at http://172.16.1.19. This is the ONLY listener that leaves
        # the machine — uvicorn stays on 127.0.0.1:8000 and PostgreSQL on
        # 127.0.0.1:5432, so nginx is the single way in and the reverse proxy
        # below is the only thing that ever talks to the API.
        #
        # What actually bounds the exposure is the Windows Firewall rule
        # "AI Business Agent HTTP": TCP/80 inbound, Private profile,
        # RemoteAddress 172.16.1.0/24. Widening this listener without widening
        # that rule changes nothing; narrowing the rule is how access is removed.
        #
        # No CORS change is needed and none was made. frontend/.env.production
        # sets VITE_API_BASE_URL=/ so every request is a relative path — a
        # browser on 172.16.1.19 asks 172.16.1.19 for /api/..., which is
        # same-origin. CORS never enters it, and CORS_ORIGINS stays as it is.
        listen       80;
        # Catch-all rather than a list of names. This is the only server block,
        # so it is the default server and would match any Host header anyway;
        # `_` says so honestly and does not go stale when DHCP moves this
        # machine to a different address.
        server_name  _;

        root  D:/MIH/AI_Business_Agent/frontend/dist;
        index index.html;

        # Applies to text/* responses served from disk. The API sets its own
        # charset, and the master data carries Bangla either way.
        charset utf-8;
        charset_types text/css text/plain application/javascript application/json;

        include D:/MIH/AI_Business_Agent/deploy/local/security-headers.conf;

        # ------------------------------------------------------------------
        # The API. Everything the backend serves, matched exactly as the
        # backend declares it rather than assumed:
        #   13 routers under /api/*  (api/__init__.py)
        #   /health, /master-data/schema, /master-data/validation-rules  (main.py)
        # The frontend calls /api/* and /health; /health is NOT under /api, so an
        # /api-only rule would return index.html for it and the connection
        # indicator would report the API down while it was running.
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass http://api_backend;

            proxy_http_version 1.1;
            # Emptied so the upstream keepalive pool above is actually used;
            # nginx otherwise forwards "close".
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # Authorization needs no rule here. Nginx forwards every request
            # header it has not been told to change, and nothing unsets it —
            # stating it explicitly would only add a line that can rot. What
            # would break it is proxy_set_header Authorization "" somewhere, or
            # underscores_in_headers for a custom header; neither applies.

            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;

            # Stream the request body straight through instead of spooling it to
            # disk first. Two reasons: DataUploadPage reports upload progress from
            # an XHR progress event, and with buffering on that progress measures
            # the hop to nginx — it would race to 100% and then sit there while
            # the real transfer happened invisibly. And an import answers 202 in
            # milliseconds, so there is no slow backend to shield from a slow
            # client, which is the case buffering exists for.
            proxy_request_buffering off;
        }

        location = /health {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_read_timeout 15s;
        }

        # The two root-level master-data endpoints and the interactive schema.
        # Checked against App.tsx: no SPA route is named /master-data, /docs,
        # /redoc or /openapi.json, so none of these shadows a page.
        location /master-data/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host       $host;
        }

        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host       $host;
        }

        # ------------------------------------------------------------------
        # Static bundle
        # ------------------------------------------------------------------

        # Vite fingerprints every file under assets/, so a changed file is a
        # changed URL and the old one can be cached indefinitely.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include D:/MIH/AI_Business_Agent/deploy/local/security-headers.conf;
            access_log off;
        }

        # Administrative boundaries. Generated by scripts/build_map_geojson.py and
        # changed only when somebody imports a new HDX release — but the filenames
        # are not fingerprinted, so this is a day rather than a year.
        location /geo/ {
            expires 1d;
            add_header Cache-Control "public";
            include D:/MIH/AI_Business_Agent/deploy/local/security-headers.conf;
        }

        # Never cached: it names the current hashed bundle, so a stale copy points
        # the browser at assets that no longer exist.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
            include D:/MIH/AI_Business_Agent/deploy/local/security-headers.conf;
        }

        # Vite copies public/ into dist/, which brings .htaccess along — Apache
        # rules for the Hostinger static deployment. Nginx does not read it and
        # it describes this server's own routing, so it is not served either.
        location ~ /\.ht {
            deny all;
        }

        # BrowserRouter: /performance?level=area is a real path, not a fragment,
        # so a hard refresh or a pasted deep link asks nginx for a file that does
        # not exist. Serve index.html for anything unresolved and let the router
        # read the URL. This is last: an earlier location wins for /api/, /assets/
        # and the rest, so nothing that should reach the backend falls in here.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
