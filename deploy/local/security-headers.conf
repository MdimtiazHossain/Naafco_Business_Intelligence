# The three response headers every location must carry.
#
# A separate file because of one nginx rule that bites silently: add_header is
# NOT additive across levels. A location that sets any add_header of its own
# discards every add_header inherited from the server block — so the cache-control
# locations below would quietly lose these three. Including this snippet in each
# such location is what keeps them everywhere.
#
# Matches frontend/nginx.conf (the Docker image's config) and dist/.htaccess
# (the Apache one) on purpose: a header added to one belongs in all three, or the
# same bundle is served with different protections depending on how it is hosted.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
